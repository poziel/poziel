name: Refresh recent projects

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recent-projects.yml'
      - 'scripts/update-recent-projects*'

concurrency:
  group: recent-projects
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    if: github.repository == 'poziel/poziel'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check updater
        run: node --test scripts/update-recent-projects.test.mjs
      - name: Update README
        run: node scripts/update-recent-projects.mjs
      - name: Commit changes if needed
        run: |
          git add README.md assets/recent-projects/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: refresh recent projects"
          git push
